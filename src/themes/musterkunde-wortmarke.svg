<!--
  Die Wortmarke des Musterkunden — ein erfundenes Logo für ein erfundenes Haus.

  Erzeugt aus Inter-Bold mit dem TrueType-Leser dieses Projekts
  (src/lib/text/truetype.ts): Glyphen als Konturen, Positionen aus
  measureText() der echten Schrift, also mit Unterschneidung. So entsteht
  dasselbe, was eine Zeichensoftware liefern würde — nur ohne eine.

  Ein echter Kunde legt hier seine eigene Datei ab. Wichtig ist nur, dass
  Buchstaben und Akzent verschiedene Füllfarben tragen: wordmarkFromSvg()
  ordnet über die Farbe zu, nicht über die Reihenfolge der Pfade.
-->
