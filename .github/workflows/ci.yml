name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Chromium holt sich Playwright selbst — die Fassung muss zur Bibliothek
      # passen, deshalb nicht aus dem Abbild, sondern hier.
      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      # Die Unit-Tests prüfen, was das Werkzeug *herstellt*. Dieser Lauf prüft,
      # ob man es *bedienen* kann — gegen `vite preview`, also gegen genau das
      # Verzeichnis, das später bereitgestellt wird. Warum das nötig ist, steht
      # im Kopf von `scripts/smoke.mjs`.
      - name: Rauchtest der Oberfläche
        run: npm run test:ui
